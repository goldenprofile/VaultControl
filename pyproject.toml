[project]
name = "vaultctl"
version = "0.1.0"
description = "CLI, разворачивающий CLI-агента для задач над Obsidian vault через навык obsidian"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["python-dotenv>=1.0"]

[project.scripts]
vaultctl = "vaultctl.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vaultctl*"]
